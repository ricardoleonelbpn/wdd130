<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco | Rata das Corredeiras</title>

    <meta name="author" content="Ricardo Leonel">
    <meta name="description" content="Esta página tem como objetivo entrar em contato conosco">

    <link rel="stylesheet" href="estilos/rafting.css">
    <link rel="stylesheet" href="estilos/contato.css">
</head>

<body>
    <header>
        <img src="imagens/logotipo_rafting.png"
          alt="Um logo com um remo e ondas, com a frase 'Expedições Emocionantes'">
        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="contato">
            <h1>Companhia de Rota das Corredeiras</h1>
            <h2>Rua Principal do Rio</h2>
            <h2>Foz do Iguaçu, Paraná</h2>
            <h2>+55 (45)99999-9999</h2>
            <h2>info@rota.corredeiras.com</h2>
        </div>
        <div class="maps">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d71216.52945579117!2d-51.83639460833528!3d-25.968645554312538!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1srio%20do%20foz%20igua%C3%A7u%20para%20google%20maps!5e1!3m2!1spt-BR!2sbr!4v1791059334457!5m2!1spt-BR!2sbr"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
        <form>
            <div class="info-cont">
                <label for="nome">Nome</label>
                <input type="text" name="nome" id="nome" placeholder="Digite aqui">

                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Digite aqui">
            </div>

            <div class="p-mensag">
                <div class="titulo-mensagem">
                    <label>Propósito da Mensagem</label>
                </div>

                <div class="opcoes-mensagem">
                    <label>
                        <input type="radio" name="pm" value="duvida">
                        Dúvida Geral
                    </label>

                    <label>
                        <input type="radio" name="pm" value="pergunta">
                        Pergunta sobre Reserva
                    </label>

                    <label>
                        <input type="radio" name="pm" value="sugestao">
                        Sugestão
                    </label>
                </div>
            </div>

            <div class="mensagem">
                <label for="mensagem">Mensagem</label>
                <textarea name="mensagem" id="mensagem" placeholder="Digite aqui"></textarea>
            </div>

            <div class="news">
                <label>
                    <input type="checkbox" name="news" id="news">
                    Por favor, me inscreva na newsletter mensal
                </label>
            </div>

            <button type="submit">Entrar em Contato!</button>
        </form>
        <section>
            <h2>Estamos aqui para servi-lo</h2>
            <div class="cta">
                <figure>
                    <img src="imagens/foto_perfil_instrutor.jpg" alt="Foto de perfil do Instrutor">
                    <figcaption>Instrutor</figcaption>
                </figure>

                <figure>
                    <img src="imagens/foto_perfil_gerente.jpg" alt="Foto de Perfil do Gerente">
                    <figcaption>Gerente</figcaption>
                </figure>

                <figure>
                    <img src="imagens/foto_perfil_instrutora.jpg" alt="Foto de Perfil da Instrutora">
                    <figcaption>Instrutora</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©2026 Rota das Corredeiras | Ricardo Leonel</p>
        <nav class="redes-sociais">
            <a href="https://www.instagram.com"><img src="imagens/instagram.svg"
                  alt="Ícone do Instagram"></a>

            <a href="https://www.facebook.com"><img src="imagens/facebook.svg"
                  alt="Ícone do Facebook"></a>

            <a href="https://www.youtube.com"><img src="imagens/youtube-square.svg"
                  alt="Ícone do Youtube"></a>

        </nav>


    </footer>
</body>

</html>
