    <main>
        <form action="">
            <label for="q1">1. O que siginifica a sigla css?</label>

                <option value="option01">"""exemplo"""</option>
                <option value="option02">#exemplo#</option>
                <option value="option03">/*exemplo*/</option>
            </select>

    </main>
